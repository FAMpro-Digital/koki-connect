name: Development tests and build

on:
  push:
    branches: [develop/phases-2-6]
  pull_request:
    branches: [develop/phases-2-6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/develop/phases-2-6' || github.base_ref == 'develop/phases-2-6'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      VITE_BUSINESS_RPC_ENABLED: 'false'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - name: Checkout reviewed development branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify development-only deployment guard
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          assert.equal(config.git.deploymentEnabled['develop/phases-2-6'], false);
          JS
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          assert.equal(JSON.parse(fs.readFileSync('assets/business/config.json', 'utf8')).enabled, false);
          JS
      - name: Test and build with loopback-only networking
        run: |
          sudo unshare --net bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- bash -euc "node --test tests/*.test.cjs; node scripts/prepare-preview.mjs"
          ' -- "$(id -un)"
