name: Qualité

# Contrôles complémentaires (ESLint, tests de bout en bout Playwright).
# Distincts du contrôle obligatoire « verify » : à rendre obligatoires dans la règle de protection
# une fois qu'ils sont stables (voir docs/CI-CD.md). Aucun accès à Supabase : le réseau externe est bloqué dans les tests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install development tools
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: ESLint
        run: npx eslint .

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install development tools
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Install Chromium
        # Le navigateur d'abord (CDN Playwright), puis les paquets système au mieux : les miroirs Ubuntu du
        # runner sont parfois injoignables et ne doivent pas bloquer les tests (l'image contient déjà les bibliothèques).
        run: |
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "::warning::Paquets système non installés (miroirs Ubuntu injoignables) : poursuite avec ceux de l'image."
      - name: End-to-end tests
        run: npm run test:e2e
