name: diag
on:
  push:
    branches: [diag/tmp-lint]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: ESLint (annotations)
        run: |
          set +e
          npx eslint . -f unix > /tmp/out.txt 2>&1
          head -c 300 /tmp/out.txt | head -3 | while IFS= read -r l; do echo "::notice::$(echo "$l" | cut -c1-300)"; done
          grep -E "\[Error|\[Warning" /tmp/out.txt | sed 's#/home/runner/work/[^/]*/[^/]*/##' | awk -F'[ ]' '{print}' | sort | uniq -c | sort -rn | head -3 >/dev/null
          grep -oE "\[(Error|Warning)/[a-z-]+\]" /tmp/out.txt | sort | uniq -c | sort -rn | while IFS= read -r l; do echo "::error::regle $l"; done
          grep -E "\[Error" /tmp/out.txt | sed 's#/home/runner/work/[^/]*/[^/]*/##' | head -25 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-260)"; done
          tail -2 /tmp/out.txt | while IFS= read -r l; do echo "::notice::$l"; done
