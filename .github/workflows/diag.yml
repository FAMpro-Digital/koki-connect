name: diag
on:
  push:
    branches: [diag/tmp-lint]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: ESLint (annotations)
        run: |
          set +e
          npx eslint . -f json > /tmp/out.json 2>/tmp/err.txt
          head -c 300 /tmp/err.txt | while IFS= read -r l; do echo "::notice::$l"; done
          node -e '
            const r=JSON.parse(require("fs").readFileSync("/tmp/out.json","utf8"));
            const c={};const lignes=[];
            for(const f of r)for(const m of f.messages){c[m.ruleId+":"+m.severity]=(c[m.ruleId+":"+m.severity]||0)+1;if(m.severity===2&&lignes.length<30)lignes.push(f.filePath.replace(/.*koki-connect\//,"")+":"+m.line+" "+m.ruleId+" "+m.message.slice(0,80));}
            console.log("::notice::"+JSON.stringify(c));
            for(const l of lignes)console.log("::error::"+l);
          '
